<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MISTÉRIO NA FLORESTA PSX · Secos &amp; Molhados</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'VT323', 'Press Start 2P', monospace;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="26" viewBox="0 0 24 26"><polygon points="2,2 20,6 14,14 20,22 12,20 6,14 2,20" fill="white" stroke="black" stroke-width="1.5"/><circle cx="6" cy="6" r="2" fill="black"/></svg>') 4 4, auto;
            overflow: hidden;
        }

        /* MOLDURA CRT EXTERNA */
        .crt-mold {
            position: relative;
            width: 1150px;
            max-width: 98vw;
            height: 800px;
            max-height: 96vh;
            background: #1c1c1c;
            border-radius: 50px 50px 30px 30px;
            box-shadow:
                0 0 0 8px #2a2a2a,
                0 0 0 14px #111,
                0 0 0 20px #1e1e1e,
                0 25px 80px rgba(0,0,0,0.9),
                inset 0 0 60px rgba(0,0,0,0.8);
            padding: 35px 30px 40px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
        }

        /* TELA CURVA (com leve curvatura simulada) */
        .crt-screen {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.9), inset 0 0 10px rgba(255,255,255,0.05);
            transform: perspective(1200px) rotateX(1deg) rotateY(-0.5deg);
            transition: transform 0.1s;
        }

        /* CANVAS 3D */
        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* OVERLAY DE SCANLINES */
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15) 0px,
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 3px
            );
            mix-blend-mode: multiply;
            z-index: 5;
        }

        /* OVERLAY DE RUÍDO (estática) */
        .noise-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.06;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2"/></filter><rect width="100" height="100" filter="url(%23n)" opacity="0.6"/></svg>');
            background-size: 200px 200px;
            animation: noiseShift 0.1s infinite;
            z-index: 6;
        }

        @keyframes noiseShift {
            0% { background-position: 0 0; }
            25% { background-position: -30px 10px; }
            50% { background-position: 15px -20px; }
            75% { background-position: -10px -5px; }
            100% { background-position: 5px 15px; }
        }

        /* MENU LATERAL ESQUERDO */
        .menu-left {
            position: absolute;
            top: 20px;
            left: 15px;
            z-index: 20;
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #fff;
            padding: 10px 8px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            font-family: 'Press Start 2P', monospace;
            font-size: 12px;
            color: #fff;
            letter-spacing: 1px;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        .menu-left .menu-item {
            cursor: pointer;
            transition: all 0.1s;
            padding: 4px 6px;
            white-space: nowrap;
            text-shadow: 2px 2px 0 #000;
        }

        .menu-left .menu-item:hover {
            background: rgba(255,255,255,0.2);
            color: #ffcc00;
            transform: translateX(2px);
        }

        .menu-left .menu-item.active {
            background: #fff;
            color: #000;
            text-shadow: none;
        }

        /* CABEÇALHO SUPERIOR DIREITO */
        .ui-header {
            position: absolute;
            top: 15px;
            right: 20px;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 18px;
            background: rgba(0,0,0,0.7);
            padding: 6px 14px;
            border-radius: 4px;
            border: 1px solid #fff;
        }

        .ui-header .title {
            font-family: 'Press Start 2P', monospace;
            font-size: 14px;
            color: #fff;
            letter-spacing: 2px;
            text-shadow: 2px 2px 0 #000;
        }

        .ui-header .icon-btn {
            cursor: pointer;
            font-size: 18px;
            color: #fff;
            background: none;
            border: 1px solid #fff;
            border-radius: 4px;
            padding: 2px 6px;
            font-family: 'Press Start 2P', monospace;
            transition: 0.1s;
        }

        .ui-header .icon-btn:hover {
            background: #fff;
            color: #000;
        }

        /* CAIXA DE DIÁLOGO INFERIOR */
        .dialogue-box {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 700px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #fff;
            padding: 12px 20px;
            font-family: 'VT323', monospace;
            font-size: 22px;
            color: #fff;
            z-index: 20;
            letter-spacing: 1px;
            min-height: 60px;
            border-radius: 6px;
            box-shadow: 0 0 20px rgba(0,0,0,0.9);
        }

        /* SOBREPOSIÇÕES (INVENTÁRIO E NOTAS) */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 30;
            display: none;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(2px);
        }

        .overlay.active {
            display: flex;
        }

        .overlay-content {
            background: #1a1a1a;
            border: 3px solid #fff;
            padding: 25px;
            width: 70%;
            max-width: 600px;
            max-height: 80%;
            overflow-y: auto;
            border-radius: 12px;
            box-shadow: 0 0 40px #000;
            color: #fff;
            font-family: 'VT323', monospace;
            font-size: 20px;
            position: relative;
        }

        .overlay-content h2 {
            font-family: 'Press Start 2P', monospace;
            font-size: 16px;
            margin-bottom: 20px;
            text-align: center;
            border-bottom: 2px solid #fff;
            padding-bottom: 10px;
        }

        .close-overlay {
            position: absolute;
            top: 10px;
            right: 15px;
            cursor: pointer;
            font-size: 24px;
            color: #fff;
            background: none;
            border: none;
            font-family: 'Press Start 2P', monospace;
        }

        /* INVENTÁRIO */
        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 10px;
        }
        .inv-slot {
            background: #2a2a2a;
            border: 2px solid #555;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: #888;
            border-radius: 4px;
        }
        .inv-slot.filled {
            background: #3d3d3d;
            border-color: #ffcc00;
            color: #ffcc00;
            box-shadow: 0 0 10px rgba(255,204,0,0.5);
        }

        /* NOTAS DE INVESTIGAÇÃO */
        .notes-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .notes-form label {
            font-size: 18px;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .notes-form input, .notes-form textarea {
            width: 100%;
            background: #111;
            border: 2px solid #555;
            color: #fff;
            padding: 8px;
            font-family: 'VT323', monospace;
            font-size: 18px;
            border-radius: 4px;
            resize: vertical;
        }
        .notes-form input:focus, .notes-form textarea:focus {
            outline: none;
            border-color: #ffcc00;
        }
        .notes-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 10px;
        }
        .notes-actions button {
            background: #2a2a2a;
            color: #fff;
            border: 2px solid #fff;
            padding: 8px 16px;
            font-family: 'Press Start 2P', monospace;
            font-size: 12px;
            cursor: pointer;
            transition: 0.1s;
        }
        .notes-actions button:hover {
            background: #fff;
            color: #000;
        }

        /* RESPONSIVIDADE BÁSICA */
        @media (max-width: 800px) {
            .menu-left {
                font-size: 9px;
                gap: 6px;
                top: 10px;
                left: 5px;
            }
            .ui-header .title {
                font-size: 9px;
            }
            .dialogue-box {
                font-size: 16px;
                width: 90%;
            }
        }
    </style>
</head>
<body>
    <div class="crt-mold">
        <div class="crt-screen">
            <!-- Canvas principal Three.js -->
            <canvas id="gameCanvas"></canvas>

            <!-- Overlays de efeito CRT -->
            <div class="scanlines"></div>
            <div class="noise-overlay"></div>

            <!-- Menu lateral esquerdo -->
            <div class="menu-left" id="menuLeft">
                <div class="menu-item active" data-scene="floresta">FLORESTA</div>
                <div class="menu-item" data-scene="cabana1">CABANA 1</div>
                <div class="menu-item" data-scene="cabana2">CABANA 2</div>
                <div class="menu-item" data-scene="cabana3">CABANA 3</div>
                <div class="menu-item" data-action="inventario">INVENTÁRIO</div>
                <div class="menu-item" data-action="notas">NOTAS DE INVESTIGAÇÃO</div>
            </div>

            <!-- Cabeçalho superior direito -->
            <div class="ui-header">
                <span class="title">MISTÉRIO NA FLORESTA PSX</span>
                <button class="icon-btn" id="soundToggle">🔊</button>
                <button class="icon-btn" id="closeBtn">✕</button>
            </div>

            <!-- Caixa de diálogo inferior -->
            <div class="dialogue-box" id="dialogueBox">
                Bem-vindo à floresta. A noite esconde segredos...
            </div>

            <!-- Overlay INVENTÁRIO -->
            <div class="overlay" id="inventoryOverlay">
                <div class="overlay-content">
                    <button class="close-overlay" data-close="inventoryOverlay">✕</button>
                    <h2>INVENTÁRIO</h2>
                    <div class="inventory-grid" id="inventoryGrid">
                        <div class="inv-slot" data-slot="0"></div>
                        <div class="inv-slot" data-slot="1"></div>
                        <div class="inv-slot" data-slot="2"></div>
                        <div class="inv-slot" data-slot="3"></div>
                    </div>
                    <p style="margin-top:15px; text-align:center; color:#aaa;">Clique nos slots para examinar</p>
                </div>
            </div>

            <!-- Overlay NOTAS DE INVESTIGAÇÃO -->
            <div class="overlay" id="notesOverlay">
                <div class="overlay-content">
                    <button class="close-overlay" data-close="notesOverlay">✕</button>
                    <h2>PRANCHETA DE INVESTIGAÇÃO</h2>
                    <div class="notes-form">
                        <label>📍 LOCAL:</label>
                        <input type="text" id="noteLocal" placeholder="[_________]" value="Clareira principal">
                        <label>🔍 EVIDÊNCIAS:</label>
                        <textarea id="noteEvidencias" rows="2" placeholder="[_________]">Nenhuma evidência coletada.</textarea>
                        <label>👤 SUSPEITOS:</label>
                        <textarea id="noteSuspeitos" rows="2" placeholder="[_________]">Desconhecidos.</textarea>
                        <label>📝 ANOTAÇÕES ADICIONAIS:</label>
                        <textarea id="noteAdicionais" rows="3" placeholder="[_________]">A floresta parece viva...</textarea>
                    </div>
                    <div class="notes-actions">
                        <button id="pencilBtn">✏️ EDITAR</button>
                        <button id="handBtn">✋ FECHAR</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Three.js e scripts -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'https://unpkg.com/three@0.128.0/examples/jsm/controls/OrbitControls.js';

        // ========== CONFIGURAÇÃO INICIAL ==========
        const canvas = document.getElementById('gameCanvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'low-power' });
        renderer.setPixelRatio(0.5); // baixa resolução para efeito PSX
        renderer.setSize(canvas.clientWidth, canvas.clientHeight, false);
        renderer.outputEncoding = THREE.sRGBEncoding;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a14);
        scene.fog = new THREE.Fog(0x0a0a14, 8, 30);

        // Câmera principal
        const camera = new THREE.PerspectiveCamera(70, canvas.clientWidth / canvas.clientHeight, 0.1, 100);
        camera.position.set(0, 8, 12);
        camera.lookAt(0, 0, 0);

        // Controles orbitais (opcional, mas para navegação suave)
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.1;
        controls.maxPolarAngle = Math.PI / 2.2;
        controls.minDistance = 5;
        controls.maxDistance = 20;
        controls.target.set(0, 1, 0);
        controls.enablePan = false;
        controls.rotateSpeed = 0.5;

        // ========== LUZES ==========
        const ambientLight = new THREE.AmbientLight(0x334466, 1.2);
        scene.add(ambientLight);

        const moonLight = new THREE.DirectionalLight(0xaaccff, 0.8);
        moonLight.position.set(10, 20, 5);
        moonLight.castShadow = false;
        scene.add(moonLight);

        // Luz da fogueira
        const fireLight = new THREE.PointLight(0xff8800, 2, 15, 2);
        fireLight.position.set(0, 2, 0);
        scene.add(fireLight);

        // ========== CHÃO ==========
        const groundGeometry = new THREE.CircleGeometry(15, 32);
        const groundMaterial = new THREE.MeshStandardMaterial({ color: 0x1a2a1a, roughness: 0.9 });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.01;
        scene.add(ground);

        // ========== PINHEIROS LOW-POLY ==========
        function createPineTree(x, z, scale = 1) {
            const group = new THREE.Group();
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x4a3a2a });
            const leafMat = new THREE.MeshStandardMaterial({ color: 0x2d4a2d, flatShading: true });

            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2 * scale, 0.3 * scale, 1.2 * scale, 5), trunkMat);
            trunk.position.y = 0.6 * scale;
            group.add(trunk);

            for (let i = 0; i < 3; i++) {
                const cone = new THREE.Mesh(new THREE.ConeGeometry(1.2 * scale - i * 0.25, 1.4 * scale, 6), leafMat);
                cone.position.y = 1.2 * scale + i * 1.1 * scale;
                group.add(cone);
            }
            group.position.set(x, 0, z);
            return group;
        }

        // Adicionar pinheiros ao redor
        for (let i = 0; i < 30; i++) {
            const angle = (i / 30) * Math.PI * 2;
            const radius = 8 + Math.random() * 6;
            const x = Math.cos(angle) * radius;
            const z = Math.sin(angle) * radius;
            const tree = createPineTree(x, z, 0.8 + Math.random() * 0.6);
            scene.add(tree);
        }

        // ========== CABANAS ==========
        function createCabin(x, z, options = {}) {
            const group = new THREE.Group();
            const wallMat = new THREE.MeshStandardMaterial({ color: options.wallColor || 0x5a3d2b, roughness: 0.8, flatShading: true });
            const roofMat = new THREE.MeshStandardMaterial({ color: options.roofColor || 0x3a2a1a, roughness: 0.9, flatShading: true });

            // Base
            const base = new THREE.Mesh(new THREE.BoxGeometry(2.2, 1.4, 2.2), wallMat);
            base.position.y = 0.7;
            group.add(base);

            // Telhado (pirâmide)
            const roof = new THREE.Mesh(new THREE.ConeGeometry(1.8, 1.2, 4), roofMat);
            roof.position.y = 2.0;
            roof.rotation.y = Math.PI / 4;
            group.add(roof);

            // Porta
            const doorMat = new THREE.MeshStandardMaterial({ color: 0x2a1a0a });
            const door = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.8, 0.1), doorMat);
            door.position.set(0, 0.4, 1.11);
            group.add(door);

            // Janelas (opcional)
            if (options.windows !== false) {
                const windowMat = new THREE.MeshStandardMaterial({ color: 0xffdd88, emissive: 0x442200 });
                const win1 = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.4, 0.1), windowMat);
                win1.position.set(-0.7, 0.9, 1.11);
                group.add(win1);
            }

            // Se a cabana estiver barricada (tábuas)
            if (options.barricaded) {
                const plankMat = new THREE.MeshStandardMaterial({ color: 0x6b4a2a });
                for (let i = -1; i <= 1; i+=0.5) {
                    const plank = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.1, 2.3), plankMat);
                    plank.position.set(i * 0.6, 0.8, 1.0);
                    group.add(plank);
                }
            }

            // Luz interna (para cabana 1)
            if (options.lightInside) {
                const pointLight = new THREE.PointLight(0xffaa44, 0.8, 3);
                pointLight.position.set(0, 1.0, 0.8);
                group.add(pointLight);
            }

            group.position.set(x, 0, z);
            group.userData = options;
            return group;
        }

        // Posições das cabanas (clareira)
        const cabin1 = createCabin(-3, -2, { name: 'cabana1', wallColor: 0x6b4a3a, lightInside: true, closed: true });
        const cabin2 = createCabin(2.5, 2.5, { name: 'cabana2', wallColor: 0x5a4a3a, open: true, fireOutside: true });
        const cabin3 = createCabin(-2, 3.5, { name: 'cabana3', wallColor: 0x4a3a2a, barricaded: true, windows: false });

        scene.add(cabin1);
        scene.add(cabin2);
        scene.add(cabin3);

        // Fogueira central (na frente da cabana 2)
        const fireGroup = new THREE.Group();
        const logMat = new THREE.MeshStandardMaterial({ color: 0x3a2a1a });
        for (let i = 0; i < 3; i++) {
            const log = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 1.5, 5), logMat);
            log.position.set(i * 0.6 - 0.6, 0.25, 0);
            log.rotation.z = Math.PI / 2 + (i * 0.3);
            fireGroup.add(log);
        }
        // Chama (cones)
        const flameMat = new THREE.MeshStandardMaterial({ color: 0xff6600, emissive: 0xff4400 });
        const flame1 = new THREE.Mesh(new THREE.ConeGeometry(0.4, 1.2, 6), flameMat);
        flame1.position.set(0, 0.8, 0);
        fireGroup.add(flame1);
        const flame2 = new THREE.Mesh(new THREE.ConeGeometry(0.25, 0.8, 5), flameMat);
        flame2.position.set(0.2, 0.9, 0.1);
        fireGroup.add(flame2);
        fireGroup.position.set(2.5, 0, 2.5);
        scene.add(fireGroup);

        // Partículas da fogueira (simples)
        const particleCount = 40;
        const particles = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount; i++) {
            particlePositions[i*3] = (Math.random() - 0.5) * 0.5;
            particlePositions[i*3+1] = Math.random() * 2;
            particlePositions[i*3+2] = (Math.random() - 0.5) * 0.5;
        }
        particles.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
        const particleMat = new THREE.PointsMaterial({ color: 0xffaa44, size: 0.1, transparent: true, blending: THREE.AdditiveBlending });
        const particleSystem = new THREE.Points(particles, particleMat);
        particleSystem.position.copy(fireGroup.position);
        scene.add(particleSystem);

        // ========== INTERAÇÃO COM RAYCASTER ==========
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        canvas.addEventListener('click', (event) => {
            const rect = canvas.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects([cabin1, cabin2, cabin3, ...cabin1.children, ...cabin2.children, ...cabin3.children], true);

            if (intersects.length > 0) {
                let hitObject = intersects[0].object;
                // Encontrar o grupo da cabana
                let cabin = hitObject;
                while (cabin && !cabin.userData.name) {
                    cabin = cabin.parent;
                }
                if (cabin && cabin.userData.name) {
                    handleCabinClick(cabin.userData.name);
                }
            }
        });

        // ========== FUNÇÕES DE INTERAÇÃO ==========
        const dialogueBox = document.getElementById('dialogueBox');
        function showMessage(text) {
            dialogueBox.textContent = text;
            dialogueBox.style.animation = 'none';
            dialogueBox.offsetHeight; // trigger reflow
            dialogueBox.style.animation = 'fadeIn 0.3s';
        }

        function handleCabinClick(cabinName) {
            switch(cabinName) {
                case 'cabana1':
                    showMessage('A porta está trancada. Uma luz fraca pulsa por baixo da fresta...');
                    playDistortedTone(220, 0.4);
                    break;
                case 'cabana2':
                    showMessage('A cabana está aberta. A fogueira estala lá fora. Você entra...');
                    playDistortedTone(330, 0.3);
                    // Adicionar item ao inventário (exemplo)
                    addInventoryItem(0, '🔑');
                    break;
                case 'cabana3':
                    showMessage('Tábuas pregadas nas janelas. Algo arranha por dentro... NÃO ENTRE.');
                    playDistortedTone(180, 0.5);
                    break;
                default:
                    showMessage('...');
            }
        }

        // ========== NAVEGAÇÃO DO MENU ==========
        const menuItems = document.querySelectorAll('.menu-item');
        const scenes = {
            floresta: { pos: [0, 8, 12], target: [0, 1, 0] },
            cabana1: { pos: [-4, 3, -0.5], target: [-3, 1, -2] },
            cabana2: { pos: [4, 3, 5], target: [2.5, 1, 2.5] },
            cabana3: { pos: [-4, 2.5, 6], target: [-2, 1, 3.5] }
        };

        function setActiveScene(sceneName) {
            const s = scenes[sceneName];
            if (!s) return;
            // Animar câmera (simples)
            const targetPos = new THREE.Vector3(...s.pos);
            const targetLook = new THREE.Vector3(...s.target);
            // Usar TWEEN-like manual (ou apenas set)
            camera.position.copy(targetPos);
            controls.target.copy(targetLook);
            controls.update();
            showMessage(`Você observa: ${sceneName.toUpperCase()}`);
        }

        menuItems.forEach(item => {
            item.addEventListener('click', (e) => {
                const scene = item.dataset.scene;
                const action = item.dataset.action;
                if (scene) {
                    // Atualizar menu ativo
                    menuItems.forEach(mi => mi.classList.remove('active'));
                    item.classList.add('active');
                    setActiveScene(scene);
                } else if (action === 'inventario') {
                    openOverlay('inventoryOverlay');
                } else if (action === 'notas') {
                    openOverlay('notesOverlay');
                }
            });
        });

        // ========== OVERLAYS ==========
        function openOverlay(id) {
            document.getElementById(id).classList.add('active');
        }
        function closeOverlay(id) {
            document.getElementById(id).classList.remove('active');
        }

        document.querySelectorAll('.close-overlay').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const overlayId = e.target.dataset.close;
                if (overlayId) closeOverlay(overlayId);
            });
        });

        document.getElementById('handBtn').addEventListener('click', () => closeOverlay('notesOverlay'));
        document.getElementById('pencilBtn').addEventListener('click', () => {
            // Focar no primeiro campo
            document.getElementById('noteLocal').focus();
        });

        // ========== INVENTÁRIO ==========
        function addInventoryItem(slot, icon) {
            const slotEl = document.querySelector(`.inv-slot[data-slot="${slot}"]`);
            if (slotEl) {
                slotEl.textContent = icon;
                slotEl.classList.add('filled');
            }
        }

        // ========== ÁUDIO (Web Audio API) ==========
        let audioCtx;
        let masterGain;
        let noiseSource;
        let isSoundOn = true;

        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            masterGain = audioCtx.createGain();
            masterGain.gain.value = 0.6;
            masterGain.connect(audioCtx.destination);

            // Ruído de fundo (vento/insetos)
            const bufferSize = audioCtx.sampleRate * 2;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }
            noiseSource = audioCtx.createBufferSource();
            noiseSource.buffer = buffer;
            noiseSource.loop = true;

            const noiseFilter = audioCtx.createBiquadFilter();
            noiseFilter.type = 'lowpass';
            noiseFilter.frequency.value = 800;
            noiseFilter.Q.value = 0.5;

            const noiseGain = audioCtx.createGain();
            noiseGain.gain.value = 0.15;

            noiseSource.connect(noiseFilter);
            noiseFilter.connect(noiseGain);
            noiseGain.connect(masterGain);
            noiseSource.start();

            // Variação sutil (LFO no gain)
            const lfo = audioCtx.createOscillator();
            lfo.frequency.value = 0.2;
            const lfoGain = audioCtx.createGain();
            lfoGain.gain.value = 0.05;
            lfo.connect(lfoGain);
            lfoGain.connect(noiseGain.gain);
            lfo.start();
        }

        function playDistortedTone(freq, duration = 0.5) {
            if (!isSoundOn || !audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const distortion = audioCtx.createWaveShaper();
            // Curva de distorção simples
            const curve = new Float32Array(256);
            for (let i = 0; i < 256; i++) {
                const x = i * 2 / 255 - 1;
                curve[i] = Math.tanh(x * 5);
            }
            distortion.curve = curve;
            distortion.oversample = '2x';

            osc.type = 'sawtooth';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(distortion);
            distortion.connect(gain);
            gain.connect(masterGain);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        // Toggle de som
        document.getElementById('soundToggle').addEventListener('click', () => {
            if (!audioCtx) initAudio();
            isSoundOn = !isSoundOn;
            if (isSoundOn) {
                masterGain.gain.value = 0.6;
                document.getElementById('soundToggle').textContent = '🔊';
            } else {
                masterGain.gain.value = 0;
                document.getElementById('soundToggle').textContent = '🔇';
            }
        });

        // Iniciar áudio na primeira interação
        document.body.addEventListener('click', initAudio, { once: true });

        // ========== ANIMAÇÃO ==========
        let clock = new THREE.Clock();

        function animate() {
            const delta = clock.getDelta();
            const time = performance.now() * 0.001;

            // Animar chamas (flicker)
            if (flame1) {
                flame1.scale.y = 1 + Math.sin(time * 15) * 0.2;
                flame2.scale.x = 1 + Math.sin(time * 18) * 0.3;
                fireLight.intensity = 1.5 + Math.sin(time * 12) * 0.5;
            }

            // Animar partículas
            if (particleSystem) {
                const positions = particleSystem.geometry.attributes.position.array;
                for (let i = 0; i < particleCount; i++) {
                    positions[i*3+1] += delta * 0.5;
                    if (positions[i*3+1] > 2) {
                        positions[i*3+1] = 0;
                        positions[i*3] = (Math.random() - 0.5) * 0.5;
                        positions[i*3+2] = (Math.random() - 0.5) * 0.5;
                    }
                }
                particleSystem.geometry.attributes.position.needsUpdate = true;
            }

            controls.update();
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        // ========== REDIMENSIONAMENTO ==========
        function resizeRenderer() {
            const rect = canvas.parentElement.getBoundingClientRect();
            renderer.setSize(rect.width, rect.height, false);
            camera.aspect = rect.width / rect.height;
            camera.updateProjectionMatrix();
        }
        window.addEventListener('resize', resizeRenderer);
        resizeRenderer();

        // ========== INICIALIZAÇÃO ==========
        showMessage('A floresta sussurra segredos. Três cabanas, um mistério...');
        animate();

        // Botão fechar (apenas visual, sem ação real)
        document.getElementById('closeBtn').addEventListener('click', () => {
            showMessage('Você não pode sair da floresta... ainda.');
        });
    </script>
</body>
</html>
